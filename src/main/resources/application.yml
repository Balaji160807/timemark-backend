server:
  port: 8080

spring:
  application:
    name: timemark-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/timemark
    username: ${DB_USERNAME:timemark}
    password: ${DB_PASSWORD:timemark}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    # Override via env var in real deployments. This default is for local dev only.
    secret: ${JWT_SECRET:dev-only-please-change-this-secret-key-before-any-real-deploy-32bytes+}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  office:
    # Default coordinates are Colombo, Sri Lanka — override per real office location.
    latitude: ${OFFICE_LAT:6.9271}
    longitude: ${OFFICE_LNG:79.8612}
    radius-meters: ${OFFICE_RADIUS_METERS:200}

  payroll:
    working-days-per-month: ${PAYROLL_WORKING_DAYS:26}

  qr:
    # HMAC key signing the daily office check-in QR code. Override in real deployments.
    secret: ${QR_SECRET:dev-only-qr-secret-please-change-before-any-real-deploy}

  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:false}
    late-checkin-cutoff: "09:30"
    reminder-cron: ${REMINDER_CRON:0 30 9 * * MON-FRI}

  s3:
    enabled: ${S3_ENABLED:false}
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:ap-south-1}

  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
